<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praticando</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Praticando</h1>
        <p>Bem-vindo ao nosso site!</p>
        <section>
            <form action="cadastro.php" method="get">
                <label for="iemail">Usuário: </label>
                <input type="email" name="email" id="iemail" placeholder="seu email" required maxlength="40">
                <br>
                <label for="isenha">Senha: </label>
                <input type="password" name="senha" id="isenha" placeholder="sua senha" required minlength="8">
            </form>
        </section>
    </main>
</body>
</html>
